name: Publish Bundle (one-off 0.5.28)

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-bundle.yml'

permissions:
  contents: read

concurrency:
  group: publish-bundle-0-5-28
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.5.28

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Verify all platform packages are on npm
        run: |
          set -euo pipefail
          for p in linux-x64 darwin-x64 darwin-arm64 win32-x64; do
            npm view "@jieai/malong-parse-$p@0.5.28" version >/dev/null
            echo "ok @jieai/malong-parse-$p@0.5.28"
          done

      - name: Build and publish main bundle
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VER="$(grep -m1 '"version"' malong/package.json | sed 's/.*: "\([0-9][0-9A-Za-z.-]*\)".*/\1/')"
          test "$VER" = "0.5.28"
          bash malong/dsh/bundle/reprep.sh
          cd malong/dsh/bundle
          sed -i "0,/\"version\": \"[^\"]*\"/s//\"version\": \"$VER\"/" package.json
          sed -i -E "s/(@jieai\/malong-parse-(linux-x64|darwin-x64|darwin-arm64|win32-x64)\": \")[^\"]*\"/\1$VER\"/" package.json
          if npm view "@jieai/dsh-malong-bridge@$VER" version >/dev/null 2>&1; then
            echo "@jieai/dsh-malong-bridge@$VER already published — skip"
            exit 0
          fi
          npm publish --access public --registry https://registry.npmjs.org
