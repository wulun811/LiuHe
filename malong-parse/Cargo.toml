[package]
name = "malong-parse"
version = "0.3.35"
edition = "2021"
description = "Rust tree-sitter multi-language symbol extraction engine for the Malong LiuHe (码龙·六合工具) LLM-native code toolkit"
license = "MIT"
repository = "https://github.com/wulun811/LiuHe"

[dependencies]
tree-sitter = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-bash = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt-multi-thread", "signal", "time", "sync", "io-util", "macros"] }
chrono = "0.4"
rayon = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
lru = "0.12"
human-panic = "2"

[profile.release]
opt-level = 3
lto = true
strip = true
